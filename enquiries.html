    <!--standard navigation bar-->

        <img src="_images/Honey Bears Backery final.jpg" alt="Honey Bears Bakery Logo"loading="lazy" style="max-width:100%; height:auto;">

    <!--Contact form: this collects customer details and order information-->
    <main>
        <h2>Place an Enquiry or Order</h2>
        <p>If you have any questions, custom cakes or would like to place an order, please fill out the form below:</p>

        <form>
            <label for="name">Your Full Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Your Email Address:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Your Phone Number:</label><br>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="message">Your Order or Enquiry:</label><br>
            <textarea id="message" name="message" required></textarea><br><br>

            <input type="submit" value="Send Enquiry">

            <button type="submit">Submit</button>
        </form>
    </main>
